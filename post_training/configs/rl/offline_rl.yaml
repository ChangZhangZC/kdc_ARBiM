defaults:
  - _self_
  - optional task@_global_: null

name: post_rl
task_name: post_training

input:
  policy_checkpoint: /path/to/act/checkpoint
  dataset_path: /path/to/offline_dataset.zarr

horizon: 50  # V1 fixed: training window equals ACT chunk_size, not deployment replan length.
n_obs_steps: 1  # V1 fixed: Scheme C uses one observation state per macro-step.
n_action_steps: 50  # V1 fixed: RL macro-action length; must equal horizon and ACT chunk_size.
chunk_as_single_action: true  # V1 fixed: one ACT chunk is one RL macro-action.
chunk_adv_clip: null

use_action_embed: true
use_conv_action_embed: false
conv_hidden_dims: [128, 256]
conv_latent_cz: 32
conv_kernel_size: 5
conv_n_groups: 8
action_recon_beta: 0.5

dynamics_type: mlp  # V1 only supported value: mlp.
predict_r: false  # V1 only supported value: false; OPE score comes from Critic Q.
use_shared_memory: false
use_wandb: true
eval: false

policy:
  init_log_std: -3.5
  log_std_min: -5.0
  log_std_max: -2.3

dataset:
  use_depth: false
  reward_scaling: none
  fixed_reward_scale: 0.1
  pad_before: 0
  pad_after: 0
  sequence_stride: 1
  finetune_sequence_stride: ${n_action_steps}
  val_ratio: 0.1
  max_train_episodes: null

dataloader:
  batch_size: 128
  num_workers: 2
  shuffle: true
  pin_memory: false
  persistent_workers: false

val_dataloader:
  batch_size: 128
  num_workers: 2
  shuffle: false  # V1 fixed: validation is deterministic.
  pin_memory: false
  persistent_workers: false

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

training:
  device: cuda:0
  seed: 42
  debug: false
  num_critic_epochs: 600
  use_ema: true
  tqdm_interval_sec: 1.0

critic:
  latent_readout: mean  # V1 only supported value: mean.
  sequence_stride: ${n_action_steps}
  q_hidden_dim: 512
  q_depth: 3
  q_lr: 1.0e-4
  target_update_freq: 2
  tau: 0.005
  gamma: 0.99
  v_hidden_dim: 512
  v_depth: 3
  v_lr: 1.0e-4
  omega: 0.7
  q_layer_norm: false
  action_embed_layer_norm: false
  action_scale_norm: false
  is_double_q: true
  is_iql: true  # V1 fixed: offline critic is IQL.
  is_share_encoder: true  # V1 fixed: Actor/Critic/Dynamics share the same latent definition.
  fix_encoder: true  # V1 fixed: ACT state encoder stays frozen during post-training.
  load_pretrain: false
  artifact_dir: null
  save_every_epochs: 0

dynamics:
  latent_mode: transformer_encoder  # V1 only supported value: transformer_encoder.
  prediction_mode: full  # V1 only supported value: full token state.
  ope_rollout_length: 2
  dynamics_hidden_dims: [400, 400, 400, 400]
  dynamics_weight_decay: [2.5e-5, 5.0e-5, 7.5e-5, 7.5e-5, 1.0e-4]
  n_ensemble: 7
  n_elites: 5
  dynamics_max_epochs: 200
  max_epochs_since_update: 50
  logvar_loss_coef: 0.01
  predict_delta: true
  fix_encoder: true  # V1 fixed: transition-model latent space must not drift.
  action_embed_layer_norm: false
  action_scale_norm: false
  load_pretrain: false
  artifact_dir: null
  save_every_epochs: 0
  tqdm_interval_sec: 1.0

unio4:
  bppo_steps: 8000
  bppo_lr: 1.0e-5
  clip_ratio: 0.25
  entropy_weight: 0.0
  max_grad_norm: 0.5
  decay: 0.96
  decay_stop_step: 200
  is_clip_decay: true
  is_bppo_lr_decay: false
  is_update_old_policy: true
  is_linear_decay: true
  temperature: null
  eval_step: 50
  eval_freq: 1000
  fix_encoder: true  # V1 fixed: PPO updates Decoder/action head/log_std only.
  use_gae: false  # V1 only supported value: false for transition-model OPE gating.
  use_ema_eval: false
  eval_times: 1
  finetune_batch_size: 128
  stage1_resume_dir: null
  artifact_dir: null
  global_best_dir: null

ppo:
  eval_env_num: 1
  enable_ratio_logging: true
  ratio_log_every_updates: 10
  ratio_plot_on_final_flush: true

ema:
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

logging:
  group: post_rl
  id: null
  mode: online
  name: ${training.seed}
  project: post_rl
  resume: false
  tags: []
  init_timeout: 120
  retry_init_timeout: 300

hydra:
  run:
    dir: post_training/outputs/${now:%Y%m%d_%H%M%S}
  sweep:
    dir: post_training/outputs/multirun/${now:%Y%m%d_%H%M%S}
    subdir: ${hydra.job.num}
