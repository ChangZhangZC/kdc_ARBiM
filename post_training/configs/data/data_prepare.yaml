# ARBiM Data Contract: LeRobot is the long-term dataset; Zarr is the RL cache.
# Main data_prepare modes:
#   lerobot_to_zarr - Convert one LeRobot Dataset directly to Offline RL Zarr.
#   merge_zarr       - Merge two or more compatible Offline RL Zarr datasets.
#
# Deprecated compatibility modes (retained until consolidated tests pass):
#   raw_to_npy       - LeRobot -> Processed NPY V2 (legacy).
#   build_db         - Processed NPY V2 -> Zarr (legacy).
mode: lerobot_to_zarr

use_depth: false
stream_batch_size: 50
jpeg_quality: 95
overwrite: false

# Direct LeRobot -> Zarr (new default)
lerobot_root: /path/to/lerobot_dataset
zarr_output_path: /path/to/new/offline_rl_reward_v2.zarr

# Reward mode determines how Teleop actions are labeled.
# Data Wheel LeRobot carries recorded staging provenance; reward_source=auto
# preserves its original verified Reward V2 indices instead of re-detecting.
reward_mode: last_gripper_release_sparse   # option: last_gripper_release_sparse / episode_end_shaped
reward_source: auto                       # option: auto / computed / recorded
reward_left_gripper_index: 7
reward_right_gripper_index: 15
reward_left_open_side: auto               # option: auto / low / high
reward_right_open_side: auto             # option: auto / low / high
reward_open_infer_frames: 5
reward_min_dwell: 3
reward_expected_cycles: 1

# Only used with reward_mode: episode_end_shaped.
max_episode_len: 2000
lambda_penalty: 0.05
smooth_penalty: 0.01

# merge_zarr: change mode above to merge_zarr, set a NEW zarr_output_path,
# and supply at least two zarr_sources. Do not mix Reward V2 and old Reward.
return_gamma: 0.99
zarr_sources:
  - name: teleop_reward_v2
    path: /path/to/teleop_reward_v2.zarr
  - name: flywheel_round_01
    path: /path/to/flywheel_round_01.zarr

# Legacy raw_to_npy/build_db fields (deprecated; existing modes still work):
processed_npy_output: /path/to/legacy/processed.npy
teleop_sources:
  - name: legacy_teleop
    path: /path/to/legacy/processed.npy
    kind: teleop_npy
