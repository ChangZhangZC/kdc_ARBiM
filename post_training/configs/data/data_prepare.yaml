# ARBiM data contract (LeRobot is the long-term dataset; Zarr is the RL view).
# Main modes:
#   lerobot_to_zarr : LeRobot -> Offline RL Zarr, Reward/Return calculated here.
#   merge_zarr      : Merge 2+ compatible Offline RL Zarr directories.
#
# The old raw_to_npy/build_db entrypoints remain temporarily for regression
# and migration compatibility; do not use them for new Data Wheel rounds.
mode: lerobot_to_zarr

# Always choose a NEW output directory. Never replace training datasets.
overwrite: false
zarr_output_path: /path/to/output/sim_task1_reward_v2.zarr

# lerobot_to_zarr input. The directory must contain meta/.
lerobot_root: /path/to/teleop_or_rollout_lerobot
use_depth: false
stream_batch_size: 50
jpeg_quality: 95

# Data Wheel LeRobot stores Reward V2 provenance in meta/.
# auto: use recorded Reward for staged episodes, calculate for Teleop episodes.
# recorded: require recorded Reward V2 for EVERY episode.
# computed: ignore recorded provenance and recompute.
reward_source: auto  # options: auto / recorded / computed
reward_mode: last_gripper_release_sparse  # alternatives: episode_end_shaped
reward_left_gripper_index: 7
reward_right_gripper_index: 15
reward_left_open_side: auto
reward_right_open_side: auto
reward_open_infer_frames: 5
reward_min_dwell: 3
reward_expected_cycles: 1

# Used only for reward_mode=episode_end_shaped.
max_episode_len: 2000
lambda_penalty: 0.05
smooth_penalty: 0.01

# merge_zarr mode settings (ignored in lerobot_to_zarr).
# Reward semantics, RGB/Depth structure, and action dimensions must match.
return_gamma: 0.99
zarr_sources:
  - name: teleop_reward_v2
    path: /path/to/teleop_reward_v2.zarr
  - name: flywheel_round_01
    path: /path/to/flywheel_round_01.zarr
