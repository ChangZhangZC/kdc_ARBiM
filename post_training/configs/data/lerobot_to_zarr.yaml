# Batch 01: LeRobot -> Offline RL Zarr, without Processed NPY.
mode: lerobot_to_zarr

# Existing LeRobot dataset root (directory containing meta/).
lerobot_root: /path/to/lerobot_dataset
zarr_output_path: /path/to/output/teleop_reward_v2.zarr

# No overwrite by default; use a fresh output path for each test/round.
overwrite: false
use_depth: false
stream_batch_size: 50
jpeg_quality: 95

# Reward is computed from LeRobot actions before writing transitions.
reward_mode: last_gripper_release_sparse
reward_left_gripper_index: 7
reward_right_gripper_index: 15
reward_left_open_side: auto
reward_right_open_side: auto
reward_open_infer_frames: 5
reward_min_dwell: 3
reward_expected_cycles: 1

# Only used if reward_mode: episode_end_shaped.
max_episode_len: 2000
lambda_penalty: 0.05
smooth_penalty: 0.01
